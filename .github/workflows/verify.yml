name: Reproduction checks
on: [push, pull_request, workflow_dispatch]
jobs:
  cached:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/cached.txt 'pytest==8.4.2'
      - run: python -m pip install --no-deps .
      - run: python scripts/verify_artifacts.py
      - run: python -m pytest tests/test_artifacts.py tests/test_reproduction.py tests/test_appendix.py -q
      - name: Require every supported target to pass and every known gap to be explicit
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          run = subprocess.run([sys.executable, 'scripts/reproduce.py', '--all', '--output', 'outputs/ci'])
          report = json.loads(Path('outputs/ci/report.json').read_text())
          registry = json.loads(Path('manifests/paper_map.json').read_text())['targets']
          gaps = {r['id'] for r in registry if r['status'] == 'missing_original_input'}
          assert {r['target'] for r in report['targets']} == {r['id'] for r in registry}
          assert all(r['status'] == ('incomplete' if r['target'] in gaps else 'passed') for r in report['targets'])
          assert run.returncode == (1 if gaps else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cached-reproduction
          path: outputs/ci/
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/test.txt
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
